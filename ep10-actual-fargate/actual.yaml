Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

  Gateway:
    Type: AWS::EC2::InternetGateway

  GatewayLink:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Network
      InternetGatewayId: !Ref Gateway

  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayLink
    Properties:
      RouteTableId: !Ref Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway

  # a load balancer needs subnets in two zones
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref Routes

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref Routes

  WebFirewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: web traffic to the load balancer
      VpcId: !Ref Network
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppFirewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: load balancer to the app
      VpcId: !Ref Network
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5006
          ToPort: 5006
          SourceSecurityGroupId: !Ref WebFirewall

  Balancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetRoute
    Properties:
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref WebFirewall]

  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Network
      TargetType: ip
      Protocol: HTTP
      Port: 5006
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 0

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Targets

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: actual

  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: actual
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: 256
      Memory: 512
      ContainerDefinitions:
        - Name: actual
          PortMappings:
            - ContainerPort: 5006
          Image: actualbudget/actual-server:CHANGE-ME

  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, SubnetARoutes, SubnetBRoutes]
    Properties:
      ServiceName: actual
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref AppFirewall]
      LoadBalancers:
        - ContainerName: actual
          ContainerPort: 5006
          TargetGroupArn: !Ref Targets

  # https on a *.cloudfront.net address, passing everything through
  Https:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: actual budget
        Origins:
          - Id: balancer
            DomainName: !GetAtt Balancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: balancer
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          # managed policies: CachingDisabled, AllViewer
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  URL:
    Value: !Sub https://${Https.DomainName}
